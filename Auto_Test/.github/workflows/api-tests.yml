name: API Automation Tests

on:
  workflow_dispatch:

jobs:
  run-tests:
    runs-on: ubuntu-latest

    steps:
      # 1. Скачиваем код репозитория
      - name: Checkout repository code
        uses: actions/checkout@v4

      # 2. Собираем Docker-образ из вашего Dockerfile
      - name: Build Docker Image
        run: docker build -t api-tests .

      # 3. Запускаем тесты внутри контейнера
      - name: Run Tests inside Docker
        run: docker run --rm api-tests

      # 4. Выгружаем отчеты (если вы настроили сохранение результатов наружу)
      - name: Upload Test Reports
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: junit-test-reports
          path: target/surefire-reports/
          retention-days: 7
